<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Toggle Form</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
			background: #edeff4;
			color: #0a4aa9;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
		}

		form {
			width: min(90%, 360px);
			padding: 2rem;
			border: 1px solid #dbe3f0;
			border-radius: 10px;
			background: #ffffff;
			box-shadow: 0 12px 30px rgb(31 41 55 / 12%);
		}

		h1 {
			margin-top: 0;
			font-size: 1.5rem;
		}

		label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 600;
		}

		.password-field {
			display: flex;
			gap: 0.5rem;
		}

		input [type="password"],
        input[type="text"] {
			box-sizing: border-box;
			flex: 1;
			min-width: 0;
			padding: 0.7rem;
			border: 1px solid #9ca3af;
			border-radius: 6px;
			font: inherit;
		}

		button {
			padding: 0.7rem 0.9rem;
			border: 0;
			border-radius: 6px;
			background: #1d4ed8;
			color: #ffffff;
			cursor: pointer;
			font: inherit;
			font-weight: 600;
		}

		button:hover {
			background: #1e40af;
		}

		.submit-button {
			width: 100%;
			margin-top: 1.25rem;
		}
	</style>
</head>
<body>
	<form id="password-form">
		<h1>Verify your password</h1>
		<label for="password">Password</label>
		<div class="password-field">
			<input id="password" name="password" type="password" autocomplete="current-password" required>
			<button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
		</div>
		<button class="submit-button" type="submit">Submit</button>
	</form>

	<script>
		const passwordInput = document.querySelector('#password');
		const toggleButton = document.querySelector('#toggle-password');
		const passwordForm = document.querySelector('#password-form');

		toggleButton.addEventListener('click', () => {
			const isHidden = passwordInput.type === 'password';
			passwordInput.type = isHidden ? 'text' : 'password';
			toggleButton.textContent = isHidden ? 'Hide' : 'Show';
			toggleButton.setAttribute('aria-pressed', String(isHidden));
		});

		passwordForm.addEventListener('submit', (event) => {
			event.preventDefault();
			alert('Password submitted successfully.');
		});
	</script>
</body>
</html>
