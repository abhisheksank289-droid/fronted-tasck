<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Local Storage Form</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #172033;
			background: #eef4f8;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			padding: 1.5rem;
			box-sizing: border-box;
			place-items: center;
		}

		main {
			width: min(100%, 520px);
		}

		.form-card {
			padding: 2rem;
			border: 1px solid #d4dee8;
			border-radius: 10px;
			background: #ffffff;
			box-shadow: 0 12px 28px rgb(23 32 51 / 10%);
		}

		h1 {
			margin-top: 0;
			margin-bottom: 0.5rem;
		}

		.description {
			margin-top: 0;
			color: #526078;
		}

		form {
			display: grid;
			gap: 1rem;
			margin-top: 1.5rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 600;
		}

		input,
		textarea,
		button {
			box-sizing: border-box;
			padding: 0.75rem;
			border: 1px solid #aab5c7;
			border-radius: 6px;
			font: inherit;
		}

		textarea {
			min-height: 130px;
			resize: vertical;
		}

		.actions {
			display: flex;
			gap: 0.75rem;
			align-items: center;
			flex-wrap: wrap;
		}

		button {
			border-color: #176b87;
			background: #176b87;
			color: #ffffff;
			cursor: pointer;
			font-weight: 600;
		}

		button:hover {
			background: #11566d;
		}

		.clear-button {
			border-color: #64748b;
			background: #ffffff;
			color: #334155;
		}

		.clear-button:hover {
			background: #f1f5f9;
		}

		#save-status {
			min-height: 1.25rem;
			margin: 0;
			color: #176b87;
			font-size: 0.9rem;
		}
	</style>
</head>
<body>
	<main>
		<section class="form-card" aria-labelledby="form-title">
			<h1 id="form-title">Contact form</h1>
			<p class="description">Your draft is saved automatically in this browser.</p>

			<form id="contact-form">
				<label for="name">Name
					<input id="name" name="name" type="text" autocomplete="name" required>
				</label>

				<label for="email">Email
					<input id="email" name="email" type="email" autocomplete="email" required>
				</label>

				<label for="message">Message
					<textarea id="message" name="message" required></textarea>
				</label>

				<div class="actions">
					<button type="submit">Submit form</button>
					<button class="clear-button" id="clear-button" type="button">Clear saved draft</button>
				</div>
				<p id="save-status" role="status" aria-live="polite"></p>
			</form>
		</section>
	</main>

	<script>
		const storageKey = 'contact-form-draft';
		const contactForm = document.querySelector('#contact-form');
		const clearButton = document.querySelector('#clear-button');
		const saveStatus = document.querySelector('#save-status');
		let saveTimer;

		restoreDraft();

		contactForm.addEventListener('input', () => {
			clearTimeout(saveTimer);
			saveStatus.textContent = 'Saving...';
			saveTimer = setTimeout(saveDraft, 250);
		});

		contactForm.addEventListener('submit', (event) => {
			event.preventDefault();
			saveDraft();
			saveStatus.textContent = 'Form submitted.';
		});

		clearButton.addEventListener('click', () => {
			localStorage.removeItem(storageKey);
			contactForm.reset();
			saveStatus.textContent = 'Saved draft cleared.';
		});

		function saveDraft() {
			const formData = new FormData(contactForm);
			const draft = Object.fromEntries(formData.entries());
			localStorage.setItem(storageKey, JSON.stringify(draft));
			saveStatus.textContent = `Draft saved at ${new Date().toLocaleTimeString()}.`;
		}

		function restoreDraft() {
			const savedDraft = localStorage.getItem(storageKey);
			if (!savedDraft) return;

			try {
				const draft = JSON.parse(savedDraft);
				Object.entries(draft).forEach(([fieldName, value]) => {
					const field = contactForm.elements.namedItem(fieldName);
					if (field) field.value = value;
				});
				saveStatus.textContent = 'Saved draft restored.';
			} catch {
				localStorage.removeItem(storageKey);
			}
		}
	</script>
</body>
</html>
